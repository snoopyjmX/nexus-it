services:
  db:
    # Fixada por digest (T-10). Para atualizar: docker pull pgvector/pgvector:pg17, leia o RepoDigests e troque aqui, no ci.yml e rode os testes.
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # Só na máquina local, nunca exposto na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@db:5432/nexus
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  nexus-pgdata:
